name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests migrations
      - run: uv run pytest tests/unit -q
      # 평가 기준선 검사(#25, ADR-0014). 실제 평가는 돌리지 않고 커밋된 data/eval/latest_summary.json만 읽는다.
      # PR이면 "평가 영향 파일이 바뀌었는데 latest_summary가 그대로"인지도 본다. 얕은 clone을 한 단계 늘려
      # PR 병합 커밋(HEAD)의 첫 부모(HEAD^1 = 병합 기준이 된 base 커밋)와 비교한다
      - name: eval baseline check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --deepen=1
            uv run python -m rfp_pm_agent.eval.check_baseline check --base HEAD^1
          else
            uv run python -m rfp_pm_agent.eval.check_baseline check
          fi
