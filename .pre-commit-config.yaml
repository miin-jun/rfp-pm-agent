repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0   # 설치 후 `uv run pre-commit autoupdate`로 최신 버전으로 갱신
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0   # 설치 후 `uv run pre-commit autoupdate`로 최신 버전으로 갱신
    hooks:
      - id: gitleaks
