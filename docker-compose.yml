services:
  postgres:
    image: postgres:16
    container_name: rfp-pm-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-si}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      AGENT_RO_USER: ${POSTGRES_READONLY_USER:-agent_ro}
      AGENT_RO_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-agent_ro}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    build:
      context: ./docker/opensearch
    container_name: rfp-pm-agent-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  opensearch_data:
