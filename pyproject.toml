[project]
name = "rfp-pm-agent"
version = "0.1.0"
description = "공공 SI RFP와 합성 PMS 데이터를 근거로 답하는 AI 어시스턴트"
readme = "README.md"
authors = [
    { name = "miin-jun", email = "ggp0258@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.13.0",
    "opensearch-py>=3.2.0",
    "pyhwp>=0.1b15",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "six>=1.17.0",
]

[project.scripts]
rfp-pm-agent = "rfp_pm_agent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["rfp_pm_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# rank_bm25 0.2.2는 타입 정보를 담고 있지 않다 (py.typed 없음, 별도 스텁 없음).
# 감싸는 쪽(search/bm25.py)에서 인자와 반환값에 타입을 붙여 경계를 막는다.
module = "rank_bm25.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local Docker services (opensearch, postgres) — run with `-m integration`",
    "tei: requires local TEI servers (docker compose up -d tei-embed tei-rerank, GPU) — run with `-m tei`",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
