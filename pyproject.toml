[project]
name = "rfp-pm-agent"
version = "0.1.0"
description = "공공 SI RFP와 합성 PMS 데이터를 근거로 답하는 AI 어시스턴트"
readme = "README.md"
authors = [
    { name = "miin-jun", email = "ggp0258@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.13.0",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
rfp-pm-agent = "rfp_pm_agent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["rfp_pm_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local Docker services (opensearch, postgres) — run with `-m integration`",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
